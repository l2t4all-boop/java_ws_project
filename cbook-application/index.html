<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Book Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
   <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
            <img src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo.svg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
            Cbook Application
            </a>
        </div>
    </nav>

    <div class="container mt-4">
         <div class="row">
            <div class="col-md-3"></div>
            <div class="col-md-6"></div>
            <div class="col-md-3">
                <button class="btn btn-primary float-end">Add Contact</button>
            </div>
       </div>
       <div class="row">
            <div class="col-md-3"></div>
            <div class="col-md-6">
                <input type="text" class="form-control" placeholder="Enter the name to search">
            </div>
            <div class="col-md-3"></div>
       </div>

        <div class="row">
            <div class="col-md-2"></div>
            <div class="col-md-8">
               <!-- add table with id,name,email,mobile and actions delete and edit-->
                <table class="table table-striped mt-4">
                      <thead>
                            <tr>
                             <th scope="col">ID</th>
                             <th scope="col">Name</th>
                             <th scope="col">Email</th>
                             <th scope="col">Mobile</th>
                             <th scope="col">Actions</th>
                            </tr>
                      </thead>
                      <tbody>
                            <tr>
                             <th scope="row">1</th>
                             <td>John Doe</td>
                             <td>john.doe@gmail.com</td>
                             <td>1234567890</td>
                                <td>
                                    <button class="btn btn-sm btn-warning">Edit</button>
                                    <button class="btn btn-sm btn-danger">Delete</button>
                                </td>
                            </tr>
                            <tr>
                             <th scope="row">2</th>
                             <td>Jane Smith</td>
                             <td>jane.smith@gmail.com</td>
                                <td>0987654321</td>
                                <td>
                                    <button class="btn btn-sm btn-warning">Edit</button>
                                    <button class="btn btn-sm btn-danger">Delete</button>
                                </td>
                                </tr>
                      </tbody>
                      </table>
            </div>
            <div class="col-md-2"></div>
       </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
