<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Details</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header with Heading -->
    <header class="bg-light border-bottom">
        <div class="container py-4">
            <div class="d-flex align-items-center justify-content-between">
                <h1 class="mb-0">Invoice Details</h1>
                <a href="index.html" class="btn btn-secondary">Back to Invoices</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container py-5">
        <!-- Invoice Header Info -->
        <div class="card mb-4" id="invoiceInfo">
            
        </div>

        <!-- Invoice Items Section -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Invoice Items</h5>
            </div>
            <div class="card-body">
                <!-- Search Bar -->
                <div class="row mb-4">
                    <div class="col-md-6 mx-auto">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text border-0 bg-white">🔍</span>
                            <input type="text" id="searchItemInput" class="form-control border-0 shadow-sm" placeholder="Search items..." onkeyup="handleItemSearch()">
                        </div>
                    </div>
                </div>

                <!-- Invoice Items Table -->
                <div class="table-responsive mb-4" id="invoiceItemsTable">
                    
                </div>

                <!-- Pagination Controls -->
                <nav id="itemPaginationControls" aria-label="Item pagination">
                    <ul class="pagination justify-content-center">
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/invoice-details.js"></script>
</body>
</html>
