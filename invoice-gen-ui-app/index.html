<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header with Heading -->
    <header class="bg-light border-bottom">
        <div class="container py-4">
            <h1 class="mb-0">Invoices</h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container py-5">
        <!-- Search Bar -->
        <div class="row mb-5">
            <div class="col-md-6 mx-auto">
                <div class="input-group input-group-lg">
                    <span class="input-group-text border-0 bg-white">🔍</span>
                    <input type="text" id="searchInput" class="form-control border-0 shadow-sm" placeholder="Search invoices..." onkeyup="handleSearch()">
                </div>
            </div>
        </div>

        <!-- Invoice Table -->
        <div class="table-responsive mb-4" id="idInvoiceTable">
            
        </div>

        <!-- Pagination Controls -->
        <nav id="paginationControls" aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center">
            </ul>
        </nav>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
